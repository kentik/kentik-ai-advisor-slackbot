[project]
name = "kentik-ai-advisor-slackbot"
version = "0.1.0"
description = "Kentik AI Advisor Slackbot application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "slack-bolt>=1.29.0",
    "slack-sdk>=3.43.0",
]

[project.scripts]
kentik-ai-advisor-slackbot = "kentik_ai_advisor_slackbot.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.0.282",
]
